<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f6fc" />
    <title>Геометрия • 8 класс</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="logo">∠</span>
      <div><b>Геометрия / 8</b><small>Понять. Решить. Проверить.</small></div>
      <span class="offline">ОФЛАЙН</span>
    </header>
    <main id="app"></main>
    <nav aria-label="Разделы">
      <button data-nav="home">
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z" /></svg
        ><span>Главная</span></button
      ><button data-nav="lessons">
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 3h14v18H5zM9 7h6M9 11h6M9 15h4" /></svg
        ><span>Темы</span></button
      ><button data-nav="practice">
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m4 16 12-12 4 4-12 12-5 1zM13 7l4 4" /></svg
        ><span>Тренировка</span></button
      ><button data-nav="formulas">
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 3h-5c-2 0-3 2-3 4v10c0 2-1 4-3 4H5M6 10h11" /></svg
        ><span>Формулы</span></button
      ><button data-nav="settings">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <path d="M4 7h16M4 17h16" />
          <circle cx="9" cy="7" r="3" />
          <circle cx="16" cy="17" r="3" /></svg
        ><span>Настройки</span>
      </button>
    </nav>
    <script src="content.js"></script>
    <script src="questions.js"></script>
    <div
      id="dialog"
      class="overlay"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialogText"
    >
      <section class="modal">
        <h2 id="dialogText"></h2>
        <div class="buttons">
          <button id="dialogNo" class="secondary">Продолжить решать</button
          ><button id="dialogYes">Выйти</button>
        </div>
      </section>
    </div>
    <div
      id="calcOverlay"
      class="overlay"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="calcTitle"
    >
      <section class="modal">
        <div class="row">
          <h2 id="calcTitle">Калькулятор</h2>
          <button
            id="calcClose"
            class="secondary"
            aria-label="Закрыть калькулятор"
          >
            ✕
          </button>
        </div>
        <label for="expression">Выражение</label
        ><input
          id="expression"
          placeholder="(3² + 4²) / 5"
          autocomplete="off"
        />
        <div id="calcResult" class="formula" role="status">0</div>
        <div class="keys">
          <button class="secondary" data-key="7">7</button
          ><button class="secondary" data-key="8">8</button
          ><button class="secondary" data-key="9">9</button
          ><button class="secondary" data-key="/">/</button
          ><button class="secondary" data-key="4">4</button
          ><button class="secondary" data-key="5">5</button
          ><button class="secondary" data-key="6">6</button
          ><button class="secondary" data-key="*">*</button
          ><button class="secondary" data-key="1">1</button
          ><button class="secondary" data-key="2">2</button
          ><button class="secondary" data-key="3">3</button
          ><button class="secondary" data-key="-">-</button
          ><button class="secondary" data-key="0">0</button
          ><button class="secondary" data-key=",">,</button
          ><button class="secondary" data-key="√(">√(</button
          ><button class="secondary" data-key="+">+</button
          ><button class="secondary" data-key="(">(</button
          ><button class="secondary" data-key=")">)</button
          ><button class="secondary" data-key="²">²</button
          ><button class="secondary" data-key="⌫">⌫</button
          ><button class="secondary" data-key="C">C</button
          ><button id="calcRun">=</button>
        </div>
      </section>
    </div>
    <script src="engine.js"></script>
    <script src="diagrams.js"></script>
    <script src="app.js"></script>
  </body>
</html>
